name: RoboDrummer Release Build

# Packaging only. No ctest here: core-ci.yml already tests every PR/push.
# Set run_qa=true to also run the core test suite before publishing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v, e.g. 0.4.0-beta.1'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        required: false
        type: boolean
        default: true
      platforms:
        description: "'all' or a comma list of: windows,mac-arm64,mac-x64,linux (or mac for both Macs)"
        required: false
        type: string
        default: all
      run_qa:
        description: 'Also run the core test suite (off by default; core-ci already does)'
        required: false
        type: boolean
        default: false
  push:
    tags: ['v*']

concurrency:
  group: robodrummer-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      base_version: ${{ steps.p.outputs.base_version }}
      tag: ${{ steps.p.outputs.tag }}
      prerelease: ${{ steps.p.outputs.prerelease }}
      run_qa: ${{ steps.p.outputs.run_qa }}
      windows: ${{ steps.p.outputs.windows }}
      mac_arm64: ${{ steps.p.outputs.mac_arm64 }}
      mac_x64: ${{ steps.p.outputs.mac_x64 }}
      linux: ${{ steps.p.outputs.linux }}
      expected: ${{ steps.p.outputs.expected }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve inputs
        id: p
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_PRERELEASE: ${{ inputs.prerelease }}
          IN_PLATFORMS: ${{ inputs.platforms }}
          IN_QA: ${{ inputs.run_qa }}
        run: bash scripts/ci/plan.sh

  qa:
    name: qa (core tests)
    needs: plan
    if: needs.plan.outputs.run_qa == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure core (no JUCE)
        run: cmake -S . -B build-core -DCMAKE_BUILD_TYPE=Release -DROBODRUMMER_BUILD_JUCE=OFF
      - name: Build core tests
        run: cmake --build build-core --parallel
      - name: Run ctest
        run: ctest --test-dir build-core --output-on-failure --parallel 4

  windows-x64:
    name: windows-x64
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fc-cache
    steps:
      - uses: actions/checkout@v4
      - name: Cache FetchContent sources (JUCE, CLAP)
        uses: actions/cache@v4
        with:
          path: .fc-cache
          key: fetchcontent-windows-${{ hashFiles('CMakeLists.txt') }}
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DROBODRUMMER_BUILD_JUCE=ON -DROBODRUMMER_BUILD_CLAP=ON
          -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR"
      - name: Build
        shell: bash
        run: |
          read -ra targets <<< "$(bash scripts/ci/targets.sh windows)"
          cmake --build build --config Release --parallel --target "${targets[@]}"
      - name: Package (zip and Inno installer)
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash scripts/ci/package.sh windows-x64 "$VERSION" build dist
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-x64
          path: dist/RoboDrummer-*
          if-no-files-found: error

  mac-arm64:
    name: mac-arm64
    needs: plan
    if: needs.plan.outputs.mac_arm64 == 'true'
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fc-cache
    steps:
      - uses: actions/checkout@v4
      - name: Cache FetchContent sources (JUCE, CLAP)
        uses: actions/cache@v4
        with:
          path: .fc-cache
          key: fetchcontent-mac-${{ hashFiles('CMakeLists.txt') }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-mac-arm64
          max-size: 500M
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DROBODRUMMER_BUILD_JUCE=ON -DROBODRUMMER_BUILD_CLAP=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR"
      - name: Build
        run: |
          read -ra targets <<< "$(bash scripts/ci/targets.sh mac)"
          cmake --build build --target "${targets[@]}"
      - name: Package (ad-hoc signed, ditto zip)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash scripts/ci/package.sh mac-arm64 "$VERSION" build dist
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-mac-arm64
          path: dist/RoboDrummer-*
          if-no-files-found: error

  mac-x64:
    name: mac-x64
    needs: plan
    if: needs.plan.outputs.mac_x64 == 'true'
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fc-cache
    steps:
      - uses: actions/checkout@v4
      - name: Cache FetchContent sources (JUCE, CLAP)
        uses: actions/cache@v4
        with:
          path: .fc-cache
          key: fetchcontent-mac-${{ hashFiles('CMakeLists.txt') }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-mac-x64
          max-size: 500M
      - name: Configure (cross-build x86_64 on the arm64 runner)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DROBODRUMMER_BUILD_JUCE=ON -DROBODRUMMER_BUILD_CLAP=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR"
      - name: Build
        run: |
          read -ra targets <<< "$(bash scripts/ci/targets.sh mac)"
          cmake --build build --target "${targets[@]}"
      - name: Package (ad-hoc signed, ditto zip)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash scripts/ci/package.sh mac-x64 "$VERSION" build dist
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-mac-x64
          path: dist/RoboDrummer-*
          if-no-files-found: error

  linux-x64:
    name: linux-x64
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fc-cache
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxi-dev libfreetype-dev libfontconfig1-dev libglu1-mesa-dev pkg-config
      - name: Cache FetchContent sources (JUCE, CLAP)
        uses: actions/cache@v4
        with:
          path: .fc-cache
          key: fetchcontent-linux-${{ hashFiles('CMakeLists.txt') }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-linux-x64
          max-size: 500M
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DROBODRUMMER_BUILD_JUCE=ON -DROBODRUMMER_BUILD_CLAP=ON
          -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          read -ra targets <<< "$(bash scripts/ci/targets.sh linux)"
          cmake --build build --target "${targets[@]}"
      - name: Package (tar.gz)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash scripts/ci/package.sh linux-x64 "$VERSION" build dist
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux-x64
          path: dist/RoboDrummer-*
          if-no-files-found: error

  release:
    name: release
    needs: [plan, qa, windows-x64, mac-arm64, mac-x64, linux-x64]
    # Publish whatever succeeded; a failed QA run (when requested) blocks publishing.
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.qa.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: artifacts
          merge-multiple: true
      - name: Create or update release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          BASE_VERSION: ${{ needs.plan.outputs.base_version }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          EXPECTED: ${{ needs.plan.outputs.expected }}
        run: bash scripts/ci/publish.sh artifacts
