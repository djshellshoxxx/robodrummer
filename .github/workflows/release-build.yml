name: RoboDrummer Release Build

# Native tests and validators must pass before any packages reach a draft release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v, e.g. 0.4.0-beta.1'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        required: false
        type: boolean
        default: true
      platforms:
        description: "all creates a release draft; subsets build artifacts only: windows,mac-arm64,mac-x64,linux (mac selects both Macs)"
        required: false
        type: string
        default: all
  push:
    tags: ['v*']

concurrency:
  group: robodrummer-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      base_version: ${{ steps.p.outputs.base_version }}
      pretag: ${{ steps.p.outputs.pretag }}
      tag: ${{ steps.p.outputs.tag }}
      prerelease: ${{ steps.p.outputs.prerelease }}
      run_qa: ${{ steps.p.outputs.run_qa }}
      windows: ${{ steps.p.outputs.windows }}
      mac_arm64: ${{ steps.p.outputs.mac_arm64 }}
      mac_x64: ${{ steps.p.outputs.mac_x64 }}
      linux: ${{ steps.p.outputs.linux }}
      expected: ${{ steps.p.outputs.expected }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve inputs
        id: p
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_PRERELEASE: ${{ inputs.prerelease }}
          IN_PLATFORMS: ${{ inputs.platforms }}
        run: bash scripts/ci/plan.sh

  qa:
    name: qa (core tests)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure core (no JUCE)
        run: cmake -S . -B build-core -DCMAKE_BUILD_TYPE=Release -DROBODRUMMER_BUILD_JUCE=OFF
      - name: Build core tests
        run: cmake --build build-core --parallel
      - name: Run ctest
        run: ctest --test-dir build-core --output-on-failure --parallel 4
      - name: Release script regression tests
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v

  windows-x64:
    name: windows-x64
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fc-cache
    steps:
      - uses: actions/checkout@v4
      - name: Cache FetchContent sources (JUCE, CLAP)
        uses: actions/cache@v4
        with:
          path: .fc-cache
          key: fetchcontent-windows-${{ hashFiles('CMakeLists.txt') }}
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DROBODRUMMER_BUILD_JUCE=ON -DROBODRUMMER_BUILD_CLAP=ON
          -DROBODRUMMER_PRERELEASE_TAG="${{ needs.plan.outputs.pretag }}"
          -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR"
      - name: Build
        shell: bash
        run: |
          read -ra targets <<< "$(bash scripts/ci/targets.sh windows)"
          cmake --build build --config Release --parallel --target "${targets[@]}"
          cmake --build build --config Release --parallel
      - name: Core tests, processor harness and blocking pluginval
        shell: bash
        run: |
          ctest --test-dir build -C Release --output-on-failure --parallel 4 -E '^(plugin_harness|default_output_reference)$'
          bash scripts/ci/juce_checks.sh build windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-windows-x64
          path: build/qa
      - name: Package (zip and Inno installer)
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          WIN_TIMESTAMP_URL: ${{ secrets.WIN_TIMESTAMP_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
          AZURE_SIGNING_DLIB: ${{ vars.AZURE_SIGNING_DLIB }}
        run: bash scripts/ci/package.sh windows-x64 "$VERSION" build dist
      - name: Validate extracted native package and final checksums
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python3 -B scripts/ci/validate_packages.py windows-x64 "$VERSION" dist --native --report build/qa/package-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaging-qa-windows-x64
          path: build/qa/package-validation.json
      - name: Isolated hosted Windows installer and uninstaller smoke
        shell: pwsh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          WIN_TIMESTAMP_URL: ${{ secrets.WIN_TIMESTAMP_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
          AZURE_SIGNING_DLIB: ${{ vars.AZURE_SIGNING_DLIB }}
        run: >-
          ./scripts/ci/windows_installer_smoke.ps1 -Version $env:VERSION
          -Archive "dist/RoboDrummer-${env:VERSION}-windows-x64.zip"
          -WorkDirectory "$env:RUNNER_TEMP/robodrummer-installer-smoke"
      - name: Always remove temporary signing inputs
        if: always()
        shell: bash
        run: python3 -B scripts/ci/signing.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-smoke-windows-x64
          path: ${{ runner.temp }}/robodrummer-installer-smoke/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-x64
          path: dist/RoboDrummer-*
          if-no-files-found: error

  mac-arm64:
    name: mac-arm64
    needs: plan
    if: needs.plan.outputs.mac_arm64 == 'true'
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fc-cache
    steps:
      - uses: actions/checkout@v4
      - name: Cache FetchContent sources (JUCE, CLAP)
        uses: actions/cache@v4
        with:
          path: .fc-cache
          key: fetchcontent-mac-arm64-${{ hashFiles('CMakeLists.txt') }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-mac-arm64
          max-size: 500M
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DROBODRUMMER_BUILD_JUCE=ON -DROBODRUMMER_BUILD_CLAP=ON
          -DROBODRUMMER_PRERELEASE_TAG="${{ needs.plan.outputs.pretag }}"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR"
      - name: Build
        run: |
          read -ra targets <<< "$(bash scripts/ci/targets.sh mac)"
          cmake --build build --target "${targets[@]}"
          cmake --build build
      - name: Core tests, processor harness and blocking auval
        run: |
          ctest --test-dir build -C Release --output-on-failure --parallel 4 -E '^(plugin_harness|default_output_reference)$'
          bash scripts/ci/juce_checks.sh build mac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-mac-arm64
          path: build/qa
      - name: Sign or explicitly package unsigned beta (ditto zip)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/ci/package.sh mac-arm64 "$VERSION" build dist
      - name: Always clean temporary signing keychains
        if: always()
        run: python3 -B scripts/ci/signing.py cleanup
      - name: Validate extracted native package and final checksums
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python3 -B scripts/ci/validate_packages.py mac-arm64 "$VERSION" dist --native --report build/qa/package-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaging-qa-mac-arm64
          path: build/qa/package-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-mac-arm64
          path: dist/RoboDrummer-*
          if-no-files-found: error

  mac-x64:
    name: mac-x64
    needs: plan
    if: needs.plan.outputs.mac_x64 == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 75
    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fc-cache
    steps:
      - uses: actions/checkout@v4
      - name: Cache FetchContent sources (JUCE, CLAP)
        uses: actions/cache@v4
        with:
          path: .fc-cache
          key: fetchcontent-mac-x64-${{ hashFiles('CMakeLists.txt') }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-mac-x64
          max-size: 500M
      - name: Configure (native x86_64 runner)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DROBODRUMMER_BUILD_JUCE=ON -DROBODRUMMER_BUILD_CLAP=ON
          -DROBODRUMMER_PRERELEASE_TAG="${{ needs.plan.outputs.pretag }}"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR"
      - name: Build
        run: |
          read -ra targets <<< "$(bash scripts/ci/targets.sh mac)"
          cmake --build build --target "${targets[@]}"
          cmake --build build
      - name: Core tests, processor harness and blocking auval
        run: |
          ctest --test-dir build -C Release --output-on-failure --parallel 4 -E '^(plugin_harness|default_output_reference)$'
          bash scripts/ci/juce_checks.sh build mac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-mac-x64
          path: build/qa
      - name: Sign or explicitly package unsigned beta (ditto zip)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/ci/package.sh mac-x64 "$VERSION" build dist
      - name: Always clean temporary signing keychains
        if: always()
        run: python3 -B scripts/ci/signing.py cleanup
      - name: Validate extracted native package and final checksums
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python3 -B scripts/ci/validate_packages.py mac-x64 "$VERSION" dist --native --report build/qa/package-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaging-qa-mac-x64
          path: build/qa/package-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-mac-x64
          path: dist/RoboDrummer-*
          if-no-files-found: error

  linux-x64:
    name: linux-x64
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fc-cache
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb openbox x11-utils libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxi-dev libfreetype-dev libfontconfig1-dev libglu1-mesa-dev pkg-config
      - name: Cache FetchContent sources (JUCE, CLAP)
        uses: actions/cache@v4
        with:
          path: .fc-cache
          key: fetchcontent-linux-${{ hashFiles('CMakeLists.txt') }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-linux-x64
          max-size: 500M
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DROBODRUMMER_BUILD_JUCE=ON -DROBODRUMMER_BUILD_CLAP=ON
          -DROBODRUMMER_PRERELEASE_TAG="${{ needs.plan.outputs.pretag }}"
          -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          read -ra targets <<< "$(bash scripts/ci/targets.sh linux)"
          cmake --build build --target "${targets[@]}"
          cmake --build build
      - name: Core tests, processor harness and blocking pluginval
        run: |
          ctest --test-dir build -C Release --output-on-failure --parallel 4 -E '^(plugin_harness|default_output_reference)$'
          bash scripts/ci/juce_checks.sh build linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-linux-x64
          path: build/qa
      - name: Package (tar.gz)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash scripts/ci/package.sh linux-x64 "$VERSION" build dist
      - name: Validate extracted native package and final checksums
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python3 -B scripts/ci/validate_packages.py linux-x64 "$VERSION" dist --native --report build/qa/package-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaging-qa-linux-x64
          path: build/qa/package-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux-x64
          path: dist/RoboDrummer-*
          if-no-files-found: error

  release:
    name: release
    needs: [plan, qa, windows-x64, mac-arm64, mac-x64, linux-x64]
    # Subset dispatches are diagnostic builds, never incomplete public releases.
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      needs.qa.result == 'success' && needs.windows-x64.result == 'success' &&
      needs.mac-arm64.result == 'success' && needs.mac-x64.result == 'success' &&
      needs.linux-x64.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: artifacts
          merge-multiple: true
      - name: Create complete release draft with immutable assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          BASE_VERSION: ${{ needs.plan.outputs.base_version }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          EXPECTED: ${{ needs.plan.outputs.expected }}
        run: bash scripts/ci/publish.sh artifacts
