name: RoboDrummer CI

# Fast PR/push checks. Tagged release builds repeat their own native quality gates.
on:
  push:
    branches: [main, 'integrate/**']
  pull_request:

concurrency:
  group: robodrummer-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Artifact-only prerelease packaging exercises unsigned native install paths.
env:
  CI_PACKAGE_VERSION: 0.4.0-beta.ci

jobs:
  windows-native:
    name: native Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fc-cache
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned JUCE and CLAP sources
        uses: actions/cache@v4
        with:
          path: .fc-cache
          key: fetchcontent-windows-${{ hashFiles('CMakeLists.txt') }}
      - name: Configure native Windows formats and harness
        shell: bash
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DROBODRUMMER_BUILD_JUCE=ON -DROBODRUMMER_BUILD_CLAP=ON
          -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR"
      - name: Build native formats and run required qualification
        shell: bash
        run: bash scripts/ci/windows_native_checks.sh build
      - name: CLAP diagnostic (unqualified practice-state contract)
        continue-on-error: true
        shell: bash
        run: python3 -B scripts/ci/clap_validate.py build/RoboDrummer_artefacts/Release/CLAP/RoboDrummer.clap --output build/qa/clap-validator.json
      - name: Package and inspect native Windows artifacts
        shell: bash
        run: |
          bash scripts/ci/package.sh windows-x64 "$CI_PACKAGE_VERSION" build dist
          python3 -B scripts/ci/validate_packages.py windows-x64 "$CI_PACKAGE_VERSION" dist --native --report build/qa/package-validation.json
      - name: Isolated hosted installer and uninstaller smoke
        shell: pwsh
        run: >-
          ./scripts/ci/windows_installer_smoke.ps1 -Version $env:CI_PACKAGE_VERSION
          -Archive "dist/RoboDrummer-${env:CI_PACKAGE_VERSION}-windows-x64.zip"
          -WorkDirectory "$env:RUNNER_TEMP/robodrummer-installer-smoke"
      - name: Always clean temporary signing inputs
        if: always()
        shell: bash
        run: python3 -B scripts/ci/signing.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-smoke-native-windows-x64
          path: ${{ runner.temp }}/robodrummer-installer-smoke/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: package-native-windows-x64
          path: dist/RoboDrummer-*
          if-no-files-found: error
      - name: Retain native validation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-native-windows-x64
          path: build/qa
      - name: Retain built native format binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64
          path: |
            build/RoboDrummer_artefacts/Release/VST3/RoboDrummer.vst3
            build/RoboDrummer_artefacts/Release/CLAP/RoboDrummer.clap
            build/RoboDrummer_artefacts/Release/Standalone/RoboDrummer.exe
          if-no-files-found: error

  mac-native:
    name: native macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fc-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .fc-cache
          key: fetchcontent-mac-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt') }}
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-mac-${{ matrix.arch }}
          max-size: 500M
      - name: Configure native formats and harness
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DROBODRUMMER_BUILD_JUCE=ON -DROBODRUMMER_BUILD_CLAP=ON
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build native formats and harness
        run: |
          read -ra targets <<< "$(bash scripts/ci/targets.sh mac)"
          cmake --build build --target "${targets[@]}" RoboDrummerHarness
      - name: Processor harness, exact compatibility, and auval
        run: bash scripts/ci/juce_checks.sh build mac
      - name: CLAP diagnostic (unqualified practice-state contract)
        continue-on-error: true
        run: python3 -B scripts/ci/clap_validate.py build/RoboDrummer_artefacts/Release/CLAP/RoboDrummer.clap --output build/qa/clap-validator.json
      - name: Package and inspect native macOS artifacts
        env:
          PACKAGE_PLATFORM: ${{ matrix.arch == 'arm64' && 'mac-arm64' || 'mac-x64' }}
        run: |
          bash scripts/ci/package.sh "$PACKAGE_PLATFORM" "$CI_PACKAGE_VERSION" build dist
          python3 -B scripts/ci/validate_packages.py "$PACKAGE_PLATFORM" "$CI_PACKAGE_VERSION" dist --native --report build/qa/package-validation.json
      - name: Always clean temporary signing inputs
        if: always()
        run: python3 -B scripts/ci/signing.py cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: package-native-mac-${{ matrix.arch }}
          path: dist/RoboDrummer-*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-native-mac-${{ matrix.arch }}
          path: build/qa

  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure core (no JUCE)
        run: cmake -S . -B build-core -DCMAKE_BUILD_TYPE=Release -DROBODRUMMER_BUILD_JUCE=OFF
      - name: Build core tests
        run: cmake --build build-core --config Release --parallel
      - name: Run ctest
        run: ctest --test-dir build-core -C Release --output-on-failure --parallel 4
      - name: Release script regression tests
        if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v

  juce-compile:
    name: juce-compile (linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fc-cache
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb openbox x11-utils libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxi-dev libfreetype-dev libfontconfig1-dev libglu1-mesa-dev pkg-config

      - name: Cache FetchContent sources (JUCE, CLAP)
        uses: actions/cache@v4
        with:
          path: .fc-cache
          key: fetchcontent-linux-${{ hashFiles('CMakeLists.txt') }}

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: juce-compile-linux
          max-size: 500M

      - name: Configure JUCE shell
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DROBODRUMMER_BUILD_JUCE=ON -DROBODRUMMER_BUILD_CLAP=ON
          -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build VST3, CLAP, Standalone
        run: cmake --build build --target RoboDrummer_VST3 RoboDrummer_CLAP RoboDrummer_Standalone

      - name: Build harness (if the target exists)
        run: |
          if grep -q 'RoboDrummerHarness' CMakeLists.txt; then
            cmake --build build --target RoboDrummerHarness
          else
            echo "No RoboDrummerHarness target yet; skipping."
          fi

      - name: Headless harness and pluginval (run once, here only)
        run: bash scripts/ci/juce_checks.sh build
      - name: CLAP diagnostic (unqualified practice-state contract)
        continue-on-error: true
        run: xvfb-run -a -s '-screen 0 1280x1024x24 -extension MIT-SHM' bash scripts/ci/with_window_manager.sh python3 -B scripts/ci/clap_validate.py build/RoboDrummer_artefacts/Release/CLAP/RoboDrummer.clap --output build/qa/clap-validator.json
      - name: Package and inspect native Linux artifacts
        run: |
          bash scripts/ci/package.sh linux-x64 "$CI_PACKAGE_VERSION" build dist
          python3 -B scripts/ci/validate_packages.py linux-x64 "$CI_PACKAGE_VERSION" dist --native --report build/qa/package-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-native-linux-x64
          path: build/qa
      - uses: actions/upload-artifact@v4
        with:
          name: package-native-linux-x64
          path: dist/RoboDrummer-*
          if-no-files-found: error

      - name: ccache stats
        run: ccache -s
